<script type="text/javascript">
  RED.nodes.registerType('nats-suite-object-get', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    icon: 'nats-icon-white.png',
    align: 'left',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'nats-suite-server', required: true },
      bucket: { value: '' },
      objectName: { value: '' },
      nameFrom: { value: 'msg' },
      outputFormat: { value: 'buffer' },
      description: { value: '' },
      maxAge: { value: 0 },
      maxBytes: { value: 0 },
      storage: { value: 'file' },
      replicas: { value: 1 },
      compression: { value: false },
      debug: { value: false },
      operation: { value: 'get' },
      watchIgnoreDeletes: { value: false },
      watchIncludeHistory: { value: false },
    },
    inputs: 1,
    outputs: 1,
    label: function () {
      return this.name || 'object get';
    },
    paletteLabel: 'nats object get',
    oneditprepare: function () {
      // Operation handler
      $('#node-input-operation').on('change', function () {
        const op = $(this).val();
        if (op === 'get') {
          $('#object-config').slideDown(200);
        } else {
          $('#object-config').slideUp(200);
        }
        if (op === 'watch') {
          $('#watch-config').slideDown(200);
        } else {
          $('#watch-config').slideUp(200);
        }
      });

      // Name source handler
      $('#node-input-nameFrom').on('change', function () {
        if ($(this).val() === 'config') {
          $('#object-name-row').slideDown(200);
        } else {
          $('#object-name-row').slideUp(200);
        }
      });

      $('#node-input-operation').trigger('change');
      $('#node-input-nameFrom').trigger('change');
    },
  });
</script>

<script type="text/markdown" data-help-name="nats-suite-object-get">
  Downloads objects from a NATS JetStream Object Store bucket, lists its contents, or watches it for changes.

  ### Modes

  - `get` - retrieve a single object
  - `list` - list all objects in the bucket
  - `watch` - emit one message per put/delete in the bucket, for as long as this node stays deployed

  The mode can be overridden dynamically by setting `msg.operation` to `get`, `list`, or `watch`.

  ### Outputs

  : payload (buffer | string | object) : the object data, shaped by the configured output format (`get` mode only)
  : info (object) : object metadata (size, chunks, etc.)
  : size (number) : object size in bytes
  : isUpdate (boolean) : true if this watch event overwrote an existing object (`watch` mode only)
  : deleted (boolean) : true if this watch event is a deletion (`watch` mode only)
</script>
