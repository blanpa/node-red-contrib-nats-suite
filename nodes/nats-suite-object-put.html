<script type="text/javascript">
  RED.nodes.registerType('nats-suite-object-put', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    icon: 'nats-icon-white.png',
    align: 'right',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'nats-suite-server', required: true },
      bucket: { value: '' },
      objectName: { value: '' },
      nameFrom: { value: 'msg' },
      targetName: { value: '' },
      targetBucket: { value: '' },
      dataFrom: { value: 'payload' },
      filePath: { value: '' },
      contentType: { value: '' },
      description: { value: '' },
      maxAge: { value: 0 },
      maxBytes: { value: 0 },
      storage: { value: 'file' },
      replicas: { value: 1 },
      compression: { value: false },
      debug: { value: false },
      operation: { value: 'put' },
    },
    inputs: 1,
    outputs: 1,
    label: function () {
      return this.name || 'object put';
    },
    paletteLabel: 'nats object put',
    oneditprepare: function () {
      // Operation handler
      $('#node-input-operation').on('change', function () {
        const op = $(this).val();
        if (
          [
            'bucket-create',
            'bucket-info',
            'bucket-delete',
            'bucket-list',
            'seal',
          ].includes(op)
        ) {
          $('#object-config').slideUp(200);
        } else {
          $('#object-config').slideDown(200);
        }
        if (op === 'link') {
          $('#link-target-config').slideDown(200);
        } else {
          $('#link-target-config').slideUp(200);
        }
      });

      // Name source handler
      $('#node-input-nameFrom').on('change', function () {
        if ($(this).val() === 'config') {
          $('#object-name-row').slideDown(200);
        } else {
          $('#object-name-row').slideUp(200);
        }
      });

      // Data source handler
      $('#node-input-dataFrom').on('change', function () {
        if ($(this).val() === 'file') {
          $('#file-path-row').slideDown(200);
        } else {
          $('#file-path-row').slideUp(200);
        }
      });

      $('#node-input-operation').trigger('change');
      $('#node-input-nameFrom').trigger('change');
      $('#node-input-dataFrom').trigger('change');
    },
  });
</script>

<script type="text/markdown" data-help-name="nats-suite-object-put">
  Uploads objects to a NATS JetStream Object Store bucket.

  ### Inputs

  : payload (any) : the data to upload
  : objectName (string, optional) : the object name
  : contentType (string, optional) : the content type
  : metadata (object, optional) : additional metadata

  ### Outputs

  : info (object) : object info (size, chunks, etc.)
  : size (number) : object size in bytes

  ### Link Operation

  Creates a new entry that references another object or bucket instead of
  storing new data. Set `targetName` (or `msg.targetName`) to link to another
  object in this same bucket, or `targetBucket` (or `msg.targetBucket`) to
  link to an entire other Object Store bucket — exactly one is required. The
  target object/bucket must already exist. Per the NATS Object Store API,
  links to other links are rejected by the server.

  ### Seal Operation

  Permanently prevents further modifications to the bucket (new puts,
  deletes, and links are all rejected by the server afterward). There is no
  unseal operation in the underlying NATS API — this is irreversible.
</script>
