<script type="text/javascript">
  RED.nodes.registerType('nats-suite-server-manager', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    defaults: {
      name: { value: '' },
      port: {
        value: 4222,
        required: true,
        validate: function (val) {
          return (
            /^\d+$/.test(val) && parseInt(val) > 0 && parseInt(val) < 65536
          );
        },
      },
      leafPort: {
        value: 7422,
        required: true,
        validate: function (val) {
          return (
            /^\d+$/.test(val) && parseInt(val) > 0 && parseInt(val) < 65536
          );
        },
      },
      enableJetStream: { value: false },
      storeDir: { value: '' },
      leafRemoteUrl: { value: '' },
      leafRemoteUser: { value: '' },
      autoStart: { value: true },
      debug: { value: false },
      // Binary source selection
      binarySource: { value: 'auto' },
      customBinaryPath: { value: '' },
      // Config source selection
      configSource: { value: 'generated' },
      configFilePath: { value: '' },
      // MQTT options
      enableMqtt: { value: false },
      mqttPort: {
        value: 1883,
        validate: function (val) {
          return (
            !val ||
            (/^\d+$/.test(val) && parseInt(val) > 0 && parseInt(val) < 65536)
          );
        },
      },
      // WebSocket options
      enableWebsocket: { value: false },
      websocketPort: {
        value: 8080,
        validate: function (val) {
          return (
            !val ||
            (/^\d+$/.test(val) && parseInt(val) > 0 && parseInt(val) < 65536)
          );
        },
      },
      // TLS options
      enableTls: { value: false },
      tlsCert: { value: '' },
      tlsKey: { value: '' },
      tlsCaCert: { value: '' },
      tlsVerify: { value: false },
      // Authentication options
      enableAuth: { value: false },
      authUser: { value: '' },
      // New embedded server options
      serverName: { value: '' },
      maxConnections: { value: '' },
      maxPayload: { value: '' },
      maxSubscriptions: { value: '' },
      maxControlLine: { value: '' },
      writeDeadline: { value: '' },
      httpPort: { value: '' },
      httpsPort: { value: '' },
      logLevel: { value: 'info' },
      enableTrace: { value: false },
      enableDebugLog: { value: false },
      noLog: { value: false },
      logFile: { value: '' },
      pidFile: { value: '' },
      maxMemoryStore: { value: '' },
      maxFileStore: { value: '' },
      memStoreOnly: { value: false },
      syncInterval: { value: '' },
      hostAddr: { value: '' },
      clientAdvertise: { value: '' },
      noAdvertise: { value: false },
      connectRetries: { value: '' },
      enableLeafNodeMode: { value: false },
    },
    // Breaking change (v1.0.0): these three moved out of defaults and into
    // credentials (encrypted), matching nats-suite-server. Existing plaintext
    // values in flows.json do NOT carry over automatically.
    credentials: {
      leafRemotePass: { type: 'password' },
      authPassword: { type: 'password' },
      authToken: { type: 'password' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'nats-icon-white.png',
    align: 'left',
    label: function () {
      return this.name || 'nats server manager';
    },
    paletteLabel: 'nats server manager',
    oneditprepare: function () {
      // Collapsible sections
      $('.nats-section-header').on('click', function () {
        const $header = $(this);
        const $content = $header.next('.nats-section-content');
        const $icon = $header.find('.nats-section-toggle');
        $content.slideToggle(200);
        $icon.toggleClass('fa-chevron-down fa-chevron-right');
        $header.toggleClass('collapsed');
      });

      // Server type handler - simplified as only 'embedded' type remains
      const updateVisibility = () => {
        const enableLeaf = $('#node-input-enableLeafNodeMode').is(':checked');

        // All embedded config (including leaf mode toggle) is always visible
        $('#embedded-config').show();
        $('#port-row').toggle(!enableLeaf); // Main port only if not leaf

        // Leaf options only visible if enableLeaf is checked
        $('#embedded-leaf-options').toggle(enableLeaf);
      };

      $('#node-input-enableLeafNodeMode').on('change', updateVisibility);

      // JetStream handler
      $('#node-input-enableJetStream').on('change', function () {
        if ($(this).is(':checked')) {
          $('#jetstream-options').slideDown(200);
        } else {
          $('#jetstream-options').slideUp(200);
        }
      });

      // HTTP Monitoring handler
      $('#node-input-httpPort').on('input', function () {
        const val = $(this).val();
        if (val && parseInt(val) > 0) {
          $('#http-hint').text(
            'Monitoring available at http://localhost:' + val
          );
        } else {
          $('#http-hint').text('Leave empty to disable HTTP monitoring');
        }
      });

      // MQTT handler
      $('#node-input-enableMqtt').on('change', function () {
        const mqttEnabled = $(this).is(':checked');
        $('#mqtt-options').toggle(mqttEnabled);

        // MQTT requires JetStream - auto-enable
        if (mqttEnabled && !$('#node-input-enableJetStream').is(':checked')) {
          $('#node-input-enableJetStream')
            .prop('checked', true)
            .trigger('change');
          $('#mqtt-jetstream-hint').show();
        } else {
          $('#mqtt-jetstream-hint').hide();
        }

        // MQTT requires server_name - show hint
        if (mqttEnabled && !$('#node-input-serverName').val()) {
          $('#mqtt-servername-hint').show();
        } else {
          $('#mqtt-servername-hint').hide();
        }
      });

      // Update MQTT hint when server name changes
      $('#node-input-serverName').on('input', function () {
        if ($('#node-input-enableMqtt').is(':checked') && !$(this).val()) {
          $('#mqtt-servername-hint').show();
        } else {
          $('#mqtt-servername-hint').hide();
        }
      });

      // Binary source handler
      $('#node-input-binarySource').on('change', function () {
        const source = $(this).val();
        $('#custom-binary-path-row').toggle(source === 'custom');

        // Update hint text based on selection
        const hints = {
          auto: 'Auto-detect: Checks available local/cache locations, then system PATH (no bundled binary)',
          custom: 'Specify the full path to your mounted nats-server binary',
          system:
            'Uses nats-server from system PATH (must be installed on host)',
        };
        $('#binary-source-hint').text(hints[source] || hints['auto']);
      });

      // Config source handler
      $('#node-input-configSource').on('change', function () {
        const source = $(this).val();
        $('#config-file-path-row').toggle(source === 'file');
        // Hide/show generated config sections when using external file
        $('.generated-config-section').toggle(source !== 'file');

        const hints = {
          generated: 'Configuration is built from the settings below',
          file: 'Use an external NATS config file (all settings below are ignored)',
        };
        $('#config-source-hint').text(hints[source] || hints['generated']);
      });

      // WebSocket handler
      $('#node-input-enableWebsocket').on('change', function () {
        $('#websocket-options').toggle($(this).is(':checked'));
      });

      // TLS handler
      $('#node-input-enableTls').on('change', function () {
        $('#tls-options').toggle($(this).is(':checked'));
      });

      // Auth handler
      $('#node-input-enableAuth').on('change', function () {
        const authEnabled = $(this).is(':checked');
        $('#auth-options').toggle(authEnabled);
      });

      // Auth type toggle (token vs user/pass)
      $('#node-input-authToken').on('input', function () {
        const hasToken = $(this).val().length > 0;
        $('#auth-userpass-row').toggle(!hasToken);
        if (hasToken) {
          $('#auth-type-hint').text('Using token authentication');
        } else {
          $('#auth-type-hint').text('Using username/password authentication');
        }
      });

      updateVisibility(); // Initial call
      $('#node-input-enableJetStream').trigger('change');
      $('#node-input-enableMqtt').trigger('change');
      $('#node-input-enableWebsocket').trigger('change');
      $('#node-input-enableTls').trigger('change');
      $('#node-input-enableAuth').trigger('change');
      $('#node-input-authToken').trigger('input');
      $('#node-input-httpPort').trigger('input');
      $('#node-input-binarySource').trigger('change');
      $('#node-input-configSource').trigger('change');
    },
  });
</script>

<script type="text/html" data-template-name="nats-suite-server-manager">
  <style>
    .nats-manager-config {
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
    }
    .nats-section {
      background: var(--red-ui-form-background);
      border: 1px solid var(--red-ui-form-input-border-color);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .nats-section-header {
      background: var(--red-ui-secondary-background);
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--red-ui-form-input-border-color);
      user-select: none;
    }
    .nats-section-header.collapsed {
      border-bottom: none;
    }
    .nats-section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 13px;
      color: var(--red-ui-form-text-color);
    }
    .nats-section-title i {
      width: 18px;
      text-align: center;
      font-size: 14px;
    }
    .nats-section-toggle {
      color: var(--red-ui-secondary-text-color);
      font-size: 11px;
    }
    .nats-section-content {
      padding: 14px;
    }
    .nats-form-row {
      margin-bottom: 12px;
    }
    .nats-form-row:last-child {
      margin-bottom: 0;
    }
    .nats-form-row label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--red-ui-form-text-color);
      margin-bottom: 5px;
    }
    .nats-form-row label i {
      margin-right: 6px;
      width: 14px;
      text-align: center;
    }
    .nats-form-row input[type='text'],
    .nats-form-row input[type='number'],
    .nats-form-row input[type='password'],
    .nats-form-row select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--red-ui-form-input-border-color);
      border-radius: 6px;
      font-size: 13px;
      background: var(--red-ui-form-input-background);
      color: var(--red-ui-form-text-color);
    }
    .nats-form-row input:focus,
    .nats-form-row select:focus {
      border-color: var(--red-ui-form-input-focus-color);
      outline: none;
    }
    .nats-form-row input[type='number'] {
      width: 120px;
    }
    .nats-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }
    .nats-checkbox-row input[type='checkbox'] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .nats-checkbox-row label {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--red-ui-form-text-color);
      cursor: pointer;
    }
    .nats-checkbox-row label i {
      margin-right: 8px;
    }
    .nats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .nats-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .nats-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      margin-left: 8px;
      border: 1px solid;
    }
    .nats-badge-info {
      border-color: var(--red-ui-border-color-success);
      color: var(--red-ui-form-text-color);
    }
    .nats-badge-advanced {
      border-color: var(--red-ui-border-color-warning);
      color: var(--red-ui-form-text-color);
    }
    .nats-info-box {
      background: var(--red-ui-secondary-background);
      border: 1px solid var(--red-ui-border-color-success);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--red-ui-form-text-color);
    }
    .nats-info-box i {
      margin-right: 8px;
    }
    .nats-info-box.nats-info-box-warning {
      border-color: var(--red-ui-border-color-warning);
    }
    .nats-subsection {
      background: var(--red-ui-secondary-background);
      border-radius: 6px;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid var(--red-ui-form-input-border-color);
    }
    .nats-subsection-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--red-ui-form-text-color);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>

  <div class="nats-manager-config">
    <!-- Basic Configuration -->
    <div class="nats-section">
      <div class="nats-section-header">
        <div class="nats-section-title">
          <i class="fa fa-cog"></i>
          <span>Basic Configuration</span>
        </div>
        <i class="fa fa-chevron-down nats-section-toggle"></i>
      </div>
      <div class="nats-section-content">
        <div class="nats-form-row">
          <label><i class="fa fa-tag"></i>Name</label>
          <input
            type="text"
            id="node-input-name"
            placeholder="Optional display name"
          />
        </div>
        <div class="nats-form-row" id="port-row">
          <label><i class="fa fa-plug"></i>Port</label>
          <input
            type="number"
            id="node-input-port"
            placeholder="4222"
            min="1"
            max="65535"
          />
          <div class="form-tips">Client connection port (default: 4222)</div>
        </div>
        <div class="nats-form-row">
          <label><i class="fa fa-cube"></i>Binary Source</label>
          <select id="node-input-binarySource">
            <option value="auto">Auto-detect (local/cache / system)</option>
            <option value="custom">Custom Binary (mounted path)</option>
            <option value="system">System PATH only</option>
          </select>
          <div class="form-tips" id="binary-source-hint">
            Auto-detect: Checks available local/cache locations, then system
            PATH (no bundled binary)
          </div>
        </div>
        <div
          class="nats-form-row"
          id="custom-binary-path-row"
          style="display: none;"
        >
          <label><i class="fa fa-file-code-o"></i>Custom Binary Path</label>
          <input
            type="text"
            id="node-input-customBinaryPath"
            placeholder="/data/bin/nats-server"
          />
          <div class="form-tips">
            Full path to your mounted nats-server binary
          </div>
        </div>

        <hr
          style="border: none; border-top: 1px solid var(--red-ui-form-input-border-color); margin: 15px 0;"
        />

        <div class="nats-form-row">
          <label><i class="fa fa-file-text"></i>Config Source</label>
          <select id="node-input-configSource">
            <option value="generated">Generated (from settings below)</option>
            <option value="file">External Config File</option>
          </select>
          <div class="form-tips" id="config-source-hint">
            Configuration is built from the settings below
          </div>
        </div>
        <div
          class="nats-form-row"
          id="config-file-path-row"
          style="display: none;"
        >
          <label><i class="fa fa-file-code-o"></i>Config File Path</label>
          <input
            type="text"
            id="node-input-configFilePath"
            placeholder="/data/nats-server.conf"
          />
          <div class="form-tips">
            Path to your NATS server config file (.conf)
          </div>
        </div>
      </div>
    </div>

    <!-- MQTT Configuration -->
    <div class="nats-section generated-config-section">
      <div class="nats-section-header">
        <div class="nats-section-title">
          <i class="fa fa-rss"></i>
          <span>MQTT Bridge</span>
        </div>
        <i class="fa fa-chevron-right nats-section-toggle"></i>
      </div>
      <div class="nats-section-content" style="display: none;">
        <div class="nats-info-box">
          <i class="fa fa-info-circle"></i>
          Enable MQTT to allow MQTT clients to connect to the NATS server. MQTT
          messages are bridged to NATS subjects.
        </div>
        <div class="nats-checkbox-row">
          <input type="checkbox" id="node-input-enableMqtt" />
          <label for="node-input-enableMqtt"
            ><i class="fa fa-rss"></i>Enable MQTT</label
          >
        </div>
        <div id="mqtt-options" style="display: none;">
          <div class="nats-form-row">
            <label><i class="fa fa-plug"></i>MQTT Port</label>
            <input
              type="number"
              id="node-input-mqttPort"
              placeholder="1883"
              min="1"
              max="65535"
            />
            <div class="form-tips">
              MQTT client connection port (default: 1883)
            </div>
          </div>
          <div
            class="nats-info-box nats-info-box-warning"
            id="mqtt-jetstream-hint"
            style="display: none;"
          >
            <i class="fa fa-exclamation-triangle"></i>
            MQTT requires JetStream - JetStream has been automatically enabled.
          </div>
          <div
            class="nats-info-box nats-info-box-warning"
            id="mqtt-servername-hint"
            style="display: none;"
          >
            <i class="fa fa-exclamation-triangle"></i>
            MQTT requires a Server Name - one will be auto-generated if not set.
          </div>
        </div>
      </div>
    </div>

    <!-- WebSocket Configuration -->
    <div class="nats-section generated-config-section">
      <div class="nats-section-header">
        <div class="nats-section-title">
          <i class="fa fa-globe"></i>
          <span>WebSocket</span>
        </div>
        <i class="fa fa-chevron-right nats-section-toggle"></i>
      </div>
      <div class="nats-section-content" style="display: none;">
        <div class="nats-info-box">
          <i class="fa fa-info-circle"></i>
          Enable WebSocket to allow browser-based clients to connect to the NATS
          server.
        </div>
        <div class="nats-checkbox-row">
          <input type="checkbox" id="node-input-enableWebsocket" />
          <label for="node-input-enableWebsocket"
            ><i class="fa fa-globe"></i>Enable WebSocket</label
          >
        </div>
        <div id="websocket-options" style="display: none;">
          <div class="nats-form-row">
            <label><i class="fa fa-plug"></i>WebSocket Port</label>
            <input
              type="number"
              id="node-input-websocketPort"
              placeholder="8080"
              min="1"
              max="65535"
            />
            <div class="form-tips">
              WebSocket client connection port (default: 8080)
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TLS Configuration -->
    <div class="nats-section generated-config-section">
      <div class="nats-section-header">
        <div class="nats-section-title">
          <i class="fa fa-lock"></i>
          <span>TLS / SSL</span>
        </div>
        <i class="fa fa-chevron-right nats-section-toggle"></i>
      </div>
      <div class="nats-section-content" style="display: none;">
        <div class="nats-info-box">
          <i class="fa fa-info-circle"></i>
          Enable TLS for encrypted connections. Requires certificate and key
          files.
        </div>
        <div class="nats-checkbox-row">
          <input type="checkbox" id="node-input-enableTls" />
          <label for="node-input-enableTls"
            ><i class="fa fa-lock"></i>Enable TLS</label
          >
        </div>
        <div id="tls-options" style="display: none;">
          <div class="nats-form-row">
            <label><i class="fa fa-certificate"></i>Certificate File</label>
            <input
              type="text"
              id="node-input-tlsCert"
              placeholder="/path/to/server-cert.pem"
            />
            <div class="form-tips">
              Path to server certificate file (PEM format)
            </div>
          </div>
          <div class="nats-form-row">
            <label><i class="fa fa-key"></i>Key File</label>
            <input
              type="text"
              id="node-input-tlsKey"
              placeholder="/path/to/server-key.pem"
            />
            <div class="form-tips">
              Path to server private key file (PEM format)
            </div>
          </div>
          <div class="nats-form-row">
            <label><i class="fa fa-shield"></i>CA Certificate (optional)</label>
            <input
              type="text"
              id="node-input-tlsCaCert"
              placeholder="/path/to/ca.pem"
            />
            <div class="form-tips">
              Path to CA certificate for client verification
            </div>
          </div>
          <div class="nats-checkbox-row">
            <input type="checkbox" id="node-input-tlsVerify" />
            <label for="node-input-tlsVerify"
              ><i class="fa fa-check-circle"></i>Verify Client
              Certificates</label
            >
          </div>
        </div>
      </div>
    </div>

    <!-- Authentication Configuration -->
    <div class="nats-section generated-config-section">
      <div class="nats-section-header">
        <div class="nats-section-title">
          <i class="fa fa-user-secret"></i>
          <span>Authentication</span>
        </div>
        <i class="fa fa-chevron-right nats-section-toggle"></i>
      </div>
      <div class="nats-section-content" style="display: none;">
        <div class="nats-info-box">
          <i class="fa fa-info-circle"></i>
          Enable authentication to require credentials for client connections.
        </div>
        <div class="nats-checkbox-row">
          <input type="checkbox" id="node-input-enableAuth" />
          <label for="node-input-enableAuth"
            ><i class="fa fa-user-secret"></i>Enable Authentication</label
          >
        </div>
        <div id="auth-options" style="display: none;">
          <div class="nats-form-row">
            <label><i class="fa fa-ticket"></i>Token (optional)</label>
            <input
              type="password"
              id="node-input-authToken"
              placeholder="Enter token for token-based auth"
              autocomplete="new-password"
            />
            <div class="form-tips" id="auth-type-hint">
              Leave empty to use username/password authentication
            </div>
          </div>
          <div id="auth-userpass-row">
            <div class="nats-grid">
              <div class="nats-form-row">
                <label><i class="fa fa-user"></i>Username</label>
                <input
                  type="text"
                  id="node-input-authUser"
                  placeholder="Username"
                />
              </div>
              <div class="nats-form-row">
                <label><i class="fa fa-lock"></i>Password</label>
                <input
                  type="password"
                  id="node-input-authPassword"
                  placeholder="Password"
                  autocomplete="new-password"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Embedded Server Configuration -->
    <div id="embedded-config" class="generated-config-section">
      <div class="nats-section">
        <div class="nats-section-header">
          <div class="nats-section-title">
            <i class="fa fa-microchip"></i>
            <span>Server Identity & Network</span>
          </div>
          <i class="fa fa-chevron-down nats-section-toggle"></i>
        </div>
        <div class="nats-section-content">
          <div class="nats-grid">
            <div class="nats-form-row">
              <label><i class="fa fa-id-badge"></i>Server Name</label>
              <input
                type="text"
                id="node-input-serverName"
                placeholder="Auto-generated"
              />
              <div class="form-tips">Unique server identifier</div>
            </div>
            <div class="nats-form-row">

            <div class="nats-info-box">

              <label><i class="fa fa-plug"></i>Leaf Node Port</label>

            <div class="nats-grid">

              <div class="nats-form-row">

          <div class="nats-info-box">

            <div class="nats-form-row">
              <label><i class="fa fa-users"></i>Max Connections</label>
              <input
                type="number"
                id="node-input-maxConnections"
                placeholder="65536"

              <div class="form-tips">Max client connections</div>

            <div class="nats-form-row">

                type="number"

            <div class="nats-form-row">

              <label><i class="fa fa-clock-o"></i>Write Deadline</label>

      <div class="nats-section">

        <div class="nats-section-content" style="display: none;">

<script type="text/markdown" data-help-name="nats-suite-server-manager">
  Starts and manages an embedded NATS server directly from Node-RED.

  _Note: This package does not bundle a NATS server binary or declare a `nats-memory-server` dependency. Install `nats-server` on the host or mount a supported custom binary (for example, v2.14.0)._

  ### Configuration Options

  **Binary Source**
  Choose where to get the nats-server binary:

  - **Auto-detect**: Checks available local/cache locations, then system PATH
  - **Custom Binary**: Use a mounted binary at a custom path
  - **System PATH**: Use nats-server from system PATH only

  **Custom Binary Path**
  Path to a custom nats-server binary (e.g., `/data/bin/nats-server`). Only visible when "Custom Binary" is selected.

  **Config Source**
  Choose how to configure the server:

  - **Generated**: Build configuration from the UI settings below
  - **External Config File**: Use a mounted .conf file (all UI settings are ignored)

  **Config File Path**
  Path to an external NATS config file (e.g., `/data/nats-server.conf`). Only visible when "External Config File" is selected.

  **Enable Embedded as Leaf Node**
  If checked, the embedded server will act as a Leaf Node, connecting to a remote NATS cluster.

  **Port**
  The port for local client connections (default: 4222). Not relevant when acting as a Leaf Node.

  **Leaf Node Port**
  The port for local Leaf Node client connections (default: 7422). Only relevant when acting as a Leaf Node.

  **Remote NATS Server URL**
  The URL of the upstream NATS cluster to connect to. Only relevant when acting as a Leaf Node.

  **Remote Username / Password**
  Optional credentials for connecting to the remote NATS cluster. Only relevant when acting as a Leaf Node.

  **Server Name**
  Unique identifier for the server instance (required for MQTT)

  **Max Connections**
  Maximum number of client connections (default: 65536)

  **Max Payload**
  Maximum message size in bytes (default: 1MB)

  **HTTP Port**
  Enable HTTP monitoring on specified port

  ### MQTT Bridge

  **Enable MQTT**
  Enable MQTT protocol support. Allows MQTT clients to connect to the NATS server.

  **MQTT Port**
  Port for MQTT client connections (default: 1883)

  _Note: MQTT requires JetStream (auto-enabled) and a Server Name (auto-generated if not set)._

  ### WebSocket

  **Enable WebSocket**
  Enable WebSocket protocol for browser-based clients.

  **WebSocket Port**
  Port for WebSocket connections (default: 8080)

  ### TLS / SSL

  **Enable TLS**
  Enable TLS encryption for all connections.

  **Certificate File**
  Path to server certificate (PEM format)

  **Key File**
  Path to server private key (PEM format)

  **CA Certificate**
  Optional CA certificate for client verification

  **Verify Client Certificates**
  Require and verify client certificates

  ### Authentication

  **Enable Authentication**
  Require credentials for client connections.

  **Token**
  Token-based authentication (takes priority over user/password)

  **Username / Password**
  Basic username/password authentication

  ### JetStream Options

  **Store Directory**
  Path for persistent JetStream data

  **Max Memory Store**
  Memory limit for in-memory streams (e.g., 1GB)

  **Max File Store**
  Disk storage limit for streams (e.g., 10GB)

  **Sync Interval**
  How often to sync data to disk (e.g., 2m)

  ### Control Commands

  Send messages to control the server. `msg.command`, `msg.payload.command`, and `msg.topic` are all equally valid - use whichever fits your flow:

  ```
  msg.command = "start"   // Start server
  msg.command = "stop"    // Stop server
  msg.command = "restart" // Restart server
  msg.command = "status"  // Get server status
  msg.command = "toggle"  // Toggle start/stop
  ```

  ### Outputs

  : topic (string) : "server.started", "server.stopped", "server.status"
  : payload.type (string) : "embedded" or "leaf"
  : payload.port (number) : The port the server is running on
  : payload.url (string) : Connection URL (e.g., "nats://localhost:4222")
  : payload.mqtt (object) : MQTT info: `{ enabled: true, port: 1883, url: "mqtt://localhost:1883" }`
  : payload.websocket (object) : WebSocket info: `{ enabled: true, port: 8080, url: "ws://localhost:8080" }`
  : payload.tls (object) : TLS info: `{ enabled: true, verify: false }`
  : payload.auth (object) : Auth info: `{ enabled: true, type: "token" }` or `{ enabled: true, type: "user" }`
  : payload.pid (number) : Process ID
  : payload.version (string) : NATS Server Version (e.g., "2.14.0")
  : payload.binarySource (string) : Binary source used: "auto", "custom", or "system"
  : payload.binaryPath (string) : Full path to the binary being used

  ### HTTP Monitoring Endpoints

  When HTTP monitoring is enabled:

  - `/varz` - Server statistics
  - `/connz` - Connection information
  - `/routez` - Route information
  - `/subsz` - Subscription information
  - `/jsz` - JetStream information
  - `/healthz` - Health check endpoint
</script>
