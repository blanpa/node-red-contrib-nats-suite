<script type="text/javascript">
  RED.nodes.registerType('nats-suite-stream-consumer', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'nats-suite-server' },
      streamName: { value: 'default-stream', required: true },
      consumerName: { value: 'default-consumer', required: true },
      createOnInit: { value: true },
      filterSubject: { value: '' },
      ackPolicy: { value: 'explicit' },
      deliverPolicy: { value: 'new' },
      startSequence: { value: 1 },
      startTime: { value: '' },
      ackWait: { value: '30s' },
      maxDeliver: { value: 5 },
      maxAckPending: { value: 1000 },
      batchSize: { value: 1 },
      maxWait: { value: 1000 },
      operation: { value: 'consume' },
      useDirectGet: { value: false },
      priorityGroups: { value: '' },
      priorityPolicy: { value: 'none' },
      priorityTimeout: { value: '' },
      pedantic: { value: false },
      pullGroup: { value: '' },
      pullMinPending: { value: 0 },
      pullMinAckPending: { value: 0 },
      pullPriority: { value: 0 },
      dataformat: { value: 'auto', required: true },
      debug: { value: false },
    },
    inputs: 1,
    outputs: 1,
    icon: 'nats-icon-white.png',
    align: 'left',
    label: function () {
      const op = this.operation || 'consume';
      if (op === 'consume') {
        return this.name || `stream sub (${this.consumerName || 'consumer'})`;
      }
      return this.name || `stream ${op}`;
    },
    paletteLabel: 'nats stream consumer',
    oneditprepare: function () {
      // Collapsible sections
      $('.nats-section-header').on('click', function () {
        const $header = $(this);
        const $content = $header.next('.nats-section-content');
        const $icon = $header.find('.nats-section-toggle');
        $content.slideToggle(200);
        $icon.toggleClass('fa-chevron-down fa-chevron-right');
        $header.toggleClass('collapsed');
      });

      // Function to update visibility based on operation and createOnInit
      function updateConsumerConfigVisibility() {
        const op = $('#node-input-operation').val();
        const createOnInit = $('#node-input-createOnInit').is(':checked');

        if (op === 'consume') {
          $('#consume-config').slideDown(200);
          // Show/hide consumer creation config and ack & delivery section based on createOnInit
          if (createOnInit) {
            $('#consumer-creation-config').slideDown(200);
            $('#consumer-settings-section').slideDown(200);
          } else {
            $('#consumer-creation-config').slideUp(200);
            $('#consumer-settings-section').slideUp(200);
          }
        } else {
          $('#consume-config').slideUp(200);
          $('#consumer-settings-section').slideUp(200);
        }

        $('#get-message-config-section').toggle(op === 'get-message');

        // Priority groups only apply to consumer creation; pull overflow
        // only applies to an actual fetch - both live in one section shown
        // whenever either path is reachable (consume auto-creates too).
        $('#priority-overflow-section').toggle(
          op === 'consume' || op === 'create' || op === 'add'
        );
      }

      // Operation handler
      $('#node-input-operation').on('change', function () {
        updateConsumerConfigVisibility();
      });

      // Create on init handler - show/hide consumer-specific configuration
      $('#node-input-createOnInit').on('change', function () {
        updateConsumerConfigVisibility();
      });

      // Deliver policy handler - show start sequence/time fields when needed
      $('#node-input-deliverPolicy').on('change', function () {
        const policy = $(this).val();
        $('#start-sequence-row').toggle(policy === 'by_start_sequence');
        $('#start-time-row').toggle(policy === 'by_start_time');
      });

      // Priority policy handler - groups/timeout only matter once a real
      // policy is selected
      $('#node-input-priorityPolicy').on('change', function () {
        $('#priority-fields-row').toggle($(this).val() !== 'none');
      });

      $('#node-input-operation').trigger('change');
      $('#node-input-deliverPolicy').trigger('change');
      $('#node-input-priorityPolicy').trigger('change');
    },
  });
</script>

<script type="text/markdown" data-help-name="nats-suite-stream-consumer">
  Consumes messages from NATS JetStream with acknowledgment control.

  ### Inputs

  : config (object, optional) : Native `ConsumerConfig` for create/add operations
  : options (object, optional) : Native create, stream info/purge, or fetch options for the selected operation
  : until (string, optional) : ISO date/time for the server-side pause operation; omit to pause indefinitely
  : seq (number, optional) : Get Message operation - retrieve by stream sequence (exactly one of `seq`/`lastBySubject` required)
  : lastBySubject (string, optional) : Get Message operation - retrieve the last message stored for this subject
  : useDirectGet (boolean, optional) : Get Message operation - overrides the "Use Direct Get" checkbox per-message
  : priorityGroups (string, optional) : Create/Add operation - comma-separated priority group names, overrides the configured field
  : priorityPolicy (string, optional) : Create/Add operation - `overflow`/`pinned_client`/`prioritized`, overrides the configured field
  : priorityTimeout (string, optional) : Create/Add operation - duration string (e.g. `30s`), overrides the configured field
  : pedantic (boolean, optional) : Create/Add operation - overrides the configured "Pedantic" checkbox; `msg.options.pedantic` wins over this if set

  ### Outputs

  : payload (any) : Message payload
  : sequence (number) : Message sequence number
  : ack (function) : Acknowledge message
  : nak (function) : Negative acknowledge (retry)
  : term (function) : Terminate (no retry)

  ### Get Message

  Retrieves a single stored message without a consumer, by stream sequence or
  by the last message on a subject. Set `msg.stream` (or the Stream Name field
  while in Consume mode), and exactly one of `msg.seq` or `msg.lastBySubject`.

  `jsm.streams.getMessage()` (the default) always works. Checking "Use Direct
  Get" switches to the faster `jsm.direct.getMessage()`, which requires the
  target stream to have been created with `allow_direct: true` (the "Allow
  Direct" checkbox on `nats-suite-stream-publisher`) - the server rejects the
  request with a real error otherwise, it does not silently fall back.

  No matching message errors rather than returning an empty payload.

  ### Priority Groups & Pull Overflow

  Priority Policy/Groups/Timeout and Pedantic apply at consumer creation
  (`priority_groups`/`priority_policy`/`priority_timeout` on `ConsumerConfig`,
  `pedantic` as a separate create-time option, not a config field). Pull
  Group/Priority/Min Pending/Min Ack Pending are per-fetch defaults for a
  consumer already created with a matching priority policy - a
  `msg.options` override always wins over these configured defaults.

  ### Acknowledgment

  ```
  // In a function node:
  msg.ack();   // Success
  msg.nak();   // Retry later
  msg.term();  // Don't retry
  ```
</script>
