<script type="text/javascript">
  RED.nodes.registerType('nats-suite-subscribe', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'nats-suite-server' },
      debug: { value: false },
      dataformat: { value: 'auto', required: true },
      datapointid: { value: '', required: false },
      subscriptionMode: { value: 'static' },
      queueGroup: { value: '', required: false },
    },
    inputs: 0,
    outputs: 1,
    icon: 'nats-icon-white.png',
    align: 'left',
    label: function () {
      return this.name || 'nats subscribe';
    },
    paletteLabel: 'nats subscribe',
    oneditprepare: function () {
      // Collapsible sections
      $('.nats-section-header').on('click', function () {
        const $header = $(this);
        const $content = $header.next('.nats-section-content');
        const $icon = $header.find('.nats-section-toggle');
        $content.slideToggle(200);
        $icon.toggleClass('fa-chevron-down fa-chevron-right');
        $header.toggleClass('collapsed');
      });

      // Subscription mode handler
      $('#node-input-subscriptionMode').on('change', function () {
        const mode = $(this).val();
        if (mode === 'static') {
          $('#nats-subject-row').slideDown(200);
        } else {
          $('#nats-subject-row').slideUp(200);
        }
      });

      // Trigger initial state
      $('#node-input-subscriptionMode').trigger('change');
    },
    oneditsave: function () {
      const mode = $('#node-input-subscriptionMode').val();

      // Set the number of inputs based on the subscription mode
      if (mode === 'static') {
        this.inputs = 0;
      } else {
        this.inputs = 1;
      }

      // Validate subject is required in static mode
      if (mode === 'static') {
        const subject = $('#node-input-datapointid').val();
        if (!subject || subject.trim().length === 0) {
          RED.notify.error('NATS Subject is required in Static mode');
          return false;
        }
      }
      return true;
    },
  });
</script>

<script type="text/markdown" data-help-name="nats-suite-subscribe">
  Subscribes to messages from NATS subjects.

  ### Subscription Modes

  - **Static:** Uses the configured subject. Input messages are ignored.
  - **Dynamic:** Subject can be changed via `msg.topic` or `msg.subject`

  ### Queue Groups

  Queue groups enable load balancing across multiple subscribers. When a queue group is specified, only one subscriber in the group receives each message. This is useful for distributing work among multiple instances.

  - Configure a static queue group in the node settings
  - Or set it dynamically via `msg.queueGroup` in Dynamic mode
  - Leave empty for regular (non-queue) subscription

  ### Outputs

  : payload (any) : The received message data (parsed based on format setting)
  : topic (string) : The topic field value based on configuration
  : _reply (string, optional) : Reply subject for request-reply patterns
  : headers (object, optional) : NATS message headers (if present)

  ### Dynamic Subscription

  ```
  // Change subscription via input message:
  msg.topic = "sensor.temperature"
  // or
  msg.subject = "sensor.humidity"

  // With queue group for load balancing:
  msg.queueGroup = "workers"
  ```

  ### Subject Wildcards

  - `*` - matches a single token (e.g., `sensor.*.temperature`)
  - `>` - matches one or more tokens (e.g., `sensor.>`)
