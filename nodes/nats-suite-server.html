<script type="text/javascript">
  RED.nodes.registerType('nats-suite-server', {
    category: 'config',
    icon: 'nats-icon-white.png',
    defaults: {
      server: { value: '', required: false },
      authMethod: { value: 'none' },
      enableTLS: { value: false },
      tlsRejectUnauthorized: { value: true },
      tlsCaFile: { value: '' },
      tlsCertFile: { value: '' },
      tlsKeyFile: { value: '' },
      reconnectTimeWait: { value: 1000 },
      timeout: { value: 10000 },
      pingInterval: { value: 30000 },
      maxPingOut: { value: 3 },
      enableTracing: { value: false },
      traceDestination: {
        value: '',
        validate: function (v) {
          // `this` is the node's data object here, not the DOM - validation
          // also runs on the canvas/deploy with no edit dialog open, where a
          // DOM selector always resolves empty and silently reports valid.
          if (!this.enableTracing) return true;
          return !!v && v.trim().length > 0;
        },
      },
      debug: { value: false },
    },
    credentials: {
      user: { type: 'text' },
      pass: { type: 'password' },
      token: { type: 'password' },
      jwt: { type: 'password' },
      nkeySeed: { type: 'password' },
    },
    label: function () {
      return this.server || 'NATS Server';
    },
    paletteLabel: 'nats server',
    oneditprepare: function () {
      // Collapsible sections
      $('.nats-section-header').on('click', function () {
        const $header = $(this);
        const $content = $header.next('.nats-section-content');
        const $icon = $header.find('.nats-section-toggle');
        $content.slideToggle(200);
        $icon.toggleClass('fa-chevron-down fa-chevron-right');
        $header.toggleClass('collapsed');
      });

      // Auth method handler
      const updateAuthFields = () => {
        const authMethod = $('#node-config-input-authMethod').val();
        $(
          '#auth-userpass-section, #auth-token-section, #auth-jwt-section, #auth-nkey-section'
        ).hide();
        switch (authMethod) {
          case 'userpass':
            $('#auth-userpass-section').slideDown(200);
            break;
          case 'token':
            $('#auth-token-section').slideDown(200);
            break;
          case 'jwt':
            $('#auth-jwt-section').slideDown(200);
            break;
          case 'nkey':
            $('#auth-nkey-section').slideDown(200);
            break;
        }
      };

      // Checkbox-driven section toggle (TLS, Tracing, ...)
      const makeCheckboxToggle = (checkboxSel, sectionSel) => () => {
        if ($(checkboxSel).is(':checked')) {
          $(sectionSel).slideDown(200);
        } else {
          $(sectionSel).slideUp(200);
        }
      };
      const updateTLSFields = makeCheckboxToggle(
        '#node-config-input-enableTLS',
        '#tls-config-section'
      );
      const updateTracingFields = makeCheckboxToggle(
        '#node-config-input-enableTracing',
        '#tracing-config-section'
      );

      updateAuthFields();
      updateTLSFields();
      updateTracingFields();

      // Sync nkeySeed value to the nkey-only textarea on open
      $('#node-config-input-nkeySeed-nkey').val(
        $('#node-config-input-nkeySeed').val()
      );

      // Keep both nkeySeed fields in sync as the user types
      $('#node-config-input-nkeySeed').on('input', function () {
        $('#node-config-input-nkeySeed-nkey').val($(this).val());
      });
      $('#node-config-input-nkeySeed-nkey').on('input', function () {
        $('#node-config-input-nkeySeed').val($(this).val());
      });

      $('#node-config-input-authMethod').on('change', updateAuthFields);
      $('#node-config-input-enableTLS').on('change', updateTLSFields);
      $('#node-config-input-enableTracing').on('change', updateTracingFields);
    },
    oneditsave: function () {
      // Ensure the nkey-only field value is written back to the credential field Node-RED reads
      const nkeyVal = $('#node-config-input-nkeySeed-nkey').val();
      if ($('#node-config-input-authMethod').val() === 'nkey' && nkeyVal) {
        $('#node-config-input-nkeySeed').val(nkeyVal);
      }
    },
  });
</script>

              <input type="text" id="node-config-input-traceDestination" placeholder="$SYS.trace.my-app">

            </div>
          </div>
        </div>
      </div>

  </div>
</script>

<script type="text/markdown" data-help-name="nats-suite-server">
  Configures a connection to a NATS server.

  ### Connection URL

  Examples:

  - `nats://localhost:4222` - Local server
  - `nats://server1:4222,nats://server2:4222` - Cluster

  ### Authentication

  - **None:** No authentication
  - **Username/Password:** Basic auth
  - **Token:** Single token
  - **JWT + NKey:** NATS 2.x authentication
  - **NKey:** Cryptographic auth

  ### TLS/SSL

  Enable TLS for encrypted connections. For mutual TLS (mTLS), provide client certificate and key.

  ### Reconnection

  Retries indefinitely using the native NATS reconnect loop and the configured reconnect wait.

  ### Message Tracing

  One switch for the whole connection: when enabled, publish/request (`nats-suite-publish`) and JetStream publish (`nats-suite-stream-publisher`) made through it also report delivery trace to the configured destination subject. KV, Object Store, and Service nodes don't carry tracing yet. Not a per-message or per-node setting.
</script>
