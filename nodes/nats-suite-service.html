<script type="text/javascript">
  RED.nodes.registerType('nats-suite-service', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'nats-suite-server', required: true },
      mode: { value: 'discover', required: true },
      // Discovery filter (discover/stats/ping modes) - independent of serviceName below,
      // which is this node's own service name in 'service' mode.
      discoveryFilter: { value: '' },
      // Service config
      serviceName: { value: 'my-service' },
      serviceVersion: { value: '1.0.0' },
      serviceDescription: { value: '' },
      endpoint: { value: 'process' },
      endpointSubject: { value: '' },
      groupSubject: { value: '' },
      groupQueue: { value: '' },
      queueGroup: { value: '' },
      metadata: { value: '' },
      autoStart: { value: true },
      // NATS Stats config
      statsType: { value: 'server' },
      // Health config
      checkOnStart: { value: true },
      periodicCheck: { value: false },
      checkInterval: { value: 30 },
      enableConnectivityTests: { value: true },
      latencyThreshold: { value: 100 },
      reconnectThreshold: { value: 5 },
      throughputThreshold: { value: 1000 },
      // Common
      debug: { value: false },
    },
    inputs: 1,
    outputs: 1,
    icon: 'nats-icon-white.png',
    align: 'left',
    label: function () {
      try {
        // If custom name is set, use it
        if (
          this.name &&
          typeof this.name === 'string' &&
          this.name.trim() !== ''
        ) {
          return this.name;
        }

        const mode = this.mode || 'discover';

        if (mode === 'service') {
          const serviceName =
            this.serviceName && typeof this.serviceName === 'string'
              ? this.serviceName.trim()
              : 'service';
          return serviceName ? `service (${serviceName})` : 'service';
        }

        if (mode === 'health') {
          return 'health';
        }

        if (mode === 'nats-stats') {
          const statsType =
            this.statsType && typeof this.statsType === 'string'
              ? this.statsType
              : 'server';
          return `stats (${statsType})`;
        }

        if (mode === 'discover') {
          return 'service discover';
        }

        if (mode === 'stats') {
          return 'service stats';
        }

        if (mode === 'ping') {
          return 'service ping';
        }

        return `service ${mode}`;
      } catch (err) {
        // Fallback if label function fails
        return 'nats service';
      }
    },
    paletteLabel: 'nats service',
    oneditprepare: function () {
      // Preserve the discovery filter stored in serviceName by pre-Step-5 flows.
      if (this.discoveryFilter === undefined && this.mode !== 'service') {
        $('#node-input-discoveryFilter').val(this.serviceName || '*');
      }

      // Mode handler
      $('#node-input-mode').on('change', function () {
        const mode = $(this).val();
        if (mode === 'service') {
          $('#service-config').slideDown(200);
          $('#discovery-config').slideUp(200);
          $('#health-config').slideUp(200);
          $('#nats-stats-config').slideUp(200);
        } else if (mode === 'health') {
          $('#service-config').slideUp(200);
          $('#discovery-config').slideUp(200);
          $('#health-config').slideDown(200);
          $('#nats-stats-config').slideUp(200);
        } else if (mode === 'nats-stats') {
          $('#service-config').slideUp(200);
          $('#discovery-config').slideUp(200);
          $('#health-config').slideUp(200);
          $('#nats-stats-config').slideDown(200);
        } else {
          $('#service-config').slideUp(200);
          $('#discovery-config').slideDown(200);
          $('#health-config').slideUp(200);
          $('#nats-stats-config').slideUp(200);
        }
      });

      // Initialize mode-based visibility
      $('#node-input-mode').trigger('change');

      // Periodic check handler
      $('#node-input-periodicCheck').on('change', function () {
        if ($(this).is(':checked')) {
          $('#check-interval-row').slideDown(200);
        } else {
          $('#check-interval-row').slideUp(200);
        }
      });
      $('#node-input-periodicCheck').trigger('change');

      // Note: Node-RED will automatically update the label when the node is saved
      // The label() function will be called with the updated config values
    },
    oneditresize: function (size) {
      // This is called when the edit dialog is resized
      // Can be used to trigger label update
      return size;
    },
  });
</script>

<script type="text/markdown" data-help-name="nats-suite-service">
  NATS Service API for microservice discovery, health monitoring, and endpoints.

  ### Modes

  - Discovery - find available services
  - Stats - get service statistics
  - Ping - check service availability
  - Service - run a service endpoint
  - Health - monitor NATS server health
  - NATS Stats - get NATS server/JetStream statistics

  ### Service Mode

  Process requests and respond, in a function node wired to this node's output:

  ```javascript
  msg.respond({ result: 'success' });
  // or
  msg.respondError('Error message', 'ERROR_CODE');
  ```

  ### Health Mode

  Outputs health status:

  : payload.status (string) : `"healthy"`, `"warning"`, or `"unhealthy"`
  : payload.connection (object) : connection status, latency, uptime
  : payload.stats (object) : messages sent/received, throughput
  : payload.alerts (array) : threshold violations

  ### NATS Stats Mode

  Stats types:

  - server - messages, bytes, reconnects
  - jetstream - memory, storage, API stats
  - connections - server info, active connections
  - all - combined statistics

  ### Dynamic Operations

  Send `msg.operation` to trigger:

  - `discover` - find services
  - `stats` - get service stats
  - `ping` - ping services
  - `start` - start service
  - `stop` - stop service
  - `reset` - reset the running service's stats (requests/errors/processing-time counters, both the library's own and this node's local status counters) - only valid while the service is running
  - `health` - run health check
  - `nats-stats` - get NATS statistics (use `msg.statsType`)
</script>
