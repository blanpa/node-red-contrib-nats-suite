<script type="text/javascript">
  RED.nodes.registerType('nats-suite-kv-get', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'nats-suite-server', required: true },
      bucket: { value: '' },
      description: { value: '' },
      history: { value: 10 },
      maxAge: { value: 0 },
      maxBytes: { value: 0 },
      maxValueSize: { value: 0 },
      compression: { value: false },
      replicas: { value: 1 },
      storage: { value: 'file' },
      mode: { value: 'get', required: true },
      key: { value: '' },
      keyFrom: { value: 'config' },
      watchPattern: { value: '' },
      watchHeadersOnly: { value: false },
      watchInclude: { value: '' },
      watchResumeFromRevision: { value: 0 },
      includeHistory: { value: false },
      historyLimit: {
        value: 1,
        validate: function (v) {
          if (!$('#node-input-includeHistory').is(':checked')) return true;
          return !isNaN(v) && parseInt(v) >= 1;
        },
      },
      ignoreDeletes: { value: true },
      parseJSON: { value: true },
      debug: { value: false },
    },
    inputs: 1,
    outputs: 1,
    icon: 'nats-icon-white.png',
    align: 'left',
    label: function () {
      return this.name || `kv get (${this.bucket || 'bucket'})`;
    },
    paletteLabel: 'nats kv get',
    oneditprepare: function () {
      // Mode handler
      $('#node-input-mode').on('change', function () {
        const mode = $(this).val();
        $('#get-config, #watch-config').hide();
        if (mode === 'get') $('#get-config').slideDown(200);
        else if (mode === 'watch') $('#watch-config').slideDown(200);
      });

      // Key source handler
      $('#node-input-keyFrom').on('change', function () {
        if ($(this).val() === 'config') {
          $('#key-config-row').slideDown(200);
        } else {
          $('#key-config-row').slideUp(200);
        }
      });

      // Include history handler
      $('#node-input-includeHistory').on('change', function () {
        $('#history-limit-row, #history-limit-tip').toggle(
          $(this).is(':checked')
        );
      });

      // Trigger initial state
      $('#node-input-mode').trigger('change');
      $('#node-input-keyFrom').trigger('change');
      $('#node-input-includeHistory').trigger('change');
    },
  });
</script>

<script type="text/markdown" data-help-name="nats-suite-kv-get">
  Get values from a NATS JetStream Key-Value bucket, or watch for changes.

  ### Modes

  - `get` - retrieve a single value
  - `watch` - subscribe to key changes
  - `keys` - list all keys in the bucket

  The mode can be overridden dynamically by setting `msg.operation` to `get`, `watch`, `keys` or `list`.

  ### Watch options

  - **Watch Pattern** - comma-separate multiple keys/patterns for a multi-key watch (server 2.10+).
  - **Headers Only** - server sends only metadata, not the value bytes. `msg.payload` is `null` on these events; `msg.length` still reports the real value size.
  - **Include** - `history` delivers all existing revisions before switching to live updates; `updates` skips the initial values entirely and only delivers changes from now on.
  - **Resume From Revision** - restart a watcher from a remembered revision instead of the beginning.

  ### Outputs

  : payload (any) : the value from the KV store, or an array of keys (`null` for a Headers Only watch event)
  : key (string) : the key name
  : revision (number) : the revision number
  : length (number) : the real value size in bytes, even when payload is `null` due to Headers Only
  : operation (string) : `"GET"`, `"PUT"`, `"DEL"`, or `"LIST"`
</script>
