<script type="text/markdown" data-help-name="nats-suite-server-pool">
  Get or replace the shared NATS connection's known server pool (`NatsConnection.getServers()` / `.setServers()`).

  ### Operations

  - `get-servers` - returns the connection's current server pool.
  - `set-servers` - replaces the pool with a new list of `host:port` entries.

  The operation can be overridden per-message via `msg.operation`.

  ### Important: `set-servers` does not move the live connection by itself

  Per the NATS client's own contract, `setServers()` only replaces the pool used
  for _future_ reconnect attempts - it does not drop the current connection or
  affect in-flight subscriptions/requests. To actually switch onto the new pool
  immediately, enable **Reconnect Immediately After Set** (or send
  `msg.reconnectAfterSet: true`), which forces a reconnect. Forcing a reconnect
  rejects any requests currently in flight on this connection.

  ### Inputs

  For `set-servers`:

  : payload (string[]) : non-empty array of `host:port` strings to replace the pool with
  : reconnectAfterSet (boolean, optional) : overrides the configured reconnect-after-set toggle for this message

  ### Outputs

  : payload (string[]) : the resulting server pool, as plain `host:port` strings
  : servers (object[]) : the full server pool with diagnostics (`hostname`, `port`, `listen`, `gossiped`, `reconnects`, `lastConnect`, `didConnect`)
</script>
