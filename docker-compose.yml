services:
  nodered:
    image: ${NODERED_IMAGE:-nodered/node-red:5.0.0}
    container_name: nodered-dev
    user: '${NODERED_UID:-1000}:${NODERED_GID:-1000}'
    ports:
      # Host side overridable via env (defaults unchanged) - see nats-server below.
      - '${NODERED_PORT:-1885}:1880'
      - '${NATS_EMBEDDED_PORT:-4223}:4223' # Expose embedded NATS server port
      - '${NATS_EMBEDDED_MQTT_PORT:-1884}:1884' # Embedded NATS MQTT port
      - '${NATS_EMBEDDED_HTTP_PORT:-8223}:8223' # Embedded NATS HTTP monitoring
      - '${NATS_EMBEDDED_WS_PORT:-8080}:8080' # Embedded NATS WebSocket port
    volumes:
      - ./node-red:/data
      - ./:/data/node_modules/node-red-contrib-nats-suite
      - ./config/certs:/data/certs:ro
      - ./config/nats-embedded.conf:/data/nats-embedded.conf:ro # Custom NATS config for embedded server
      - ./bin:/data/bin:ro # Custom NATS binaries (nats-server-linux-amd64, nats-server-linux-arm64)
    environment:
      - TZ=Europe/Berlin
    depends_on:
      - nats-server
    restart: unless-stopped

  nats-server:
    image: nats:latest
    container_name: nats-server-dev
    ports:
      # Host side overridable via env (defaults unchanged) - some hosts already
      # run something on 4222/1883/8222 (e.g. a system mosquitto service).
      - '${NATS_CLIENT_PORT:-4222}:4222' # NATS Client connections
      - '${NATS_MQTT_PORT:-1883}:1883' # MQTT connections
      - '${NATS_HTTP_PORT:-8222}:8222' # HTTP monitoring
      - '6222:6222' # Cluster routing
    command:
      - '-c'
      - '/etc/nats/nats-server.conf'
    volumes:
      - ./config/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data # Persistent JetStream storage
      - ./config/certs:/etc/nats/certs:ro
    restart: unless-stopped

  nui:
    image: ghcr.io/nats-nui/nui:latest
    container_name: nui-dev
    ports:
      - '31311:31311'
    environment:
      - NUI_NATS_URL=nats://nats-server:4222
    depends_on:
      - nats-server
    restart: unless-stopped

volumes:
  nats-data:
