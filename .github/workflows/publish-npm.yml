name: Publish NPM Package on Tag

# Veröffentlicht via npm Trusted Publishing (OIDC) — es wird KEIN NPM_TOKEN
# benötigt. Voraussetzung: Auf npmjs.com ist unter
# "Package settings -> Trusted Publishers" dieses Repo mit dem Workflow-
# Dateinamen publish-npm.yml hinterlegt.

on:
  push:
    tags:
      - '*.*.*'  # Triggert bei Tags wie 1.0.0, 2.1.3, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read      # checkout
      id-token: write     # erforderlich für Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing benötigt npm >= 11.5.1; Node 20 bringt npm 10.x mit.
      # Bewusst auf die 11er-Linie gepinnt: npm@latest ist inzwischen 12.x und
      # verlangt node ^22.22.2 || ^24.15.0 || >=26.
      - name: Update npm
        run: npm install -g npm@^11

      - run: npm install
      
      # Extrahiere Version aus Tag
      - name: Set version from tag
        run: |
          # GITHUB_REF ist z.B. refs/tags/1.2.3
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "Setze Version auf: $TAG_VERSION"
          npm version $TAG_VERSION --no-git-tag-version --allow-same-version
      
      # Dry-Run: Zeigt was publiziert würde, ohne zu publizieren
      - name: Dry-Run
        run: npm publish --dry-run
      
      # Kein NODE_AUTH_TOKEN: npm holt die Credentials per OIDC vom auf
      # npmjs.com hinterlegten Trusted Publisher. Provenance wird dabei
      # automatisch angehängt.
      - name: Publish to NPM
        run: npm publish --access public
